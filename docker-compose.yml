services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: rooted-falkordb
    ports:
      - "6379:6379"   # FalkorDB (Redis protocol)
      - "3000:3000"   # FalkorDB Browser
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb_data:
